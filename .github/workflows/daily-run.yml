name: Daily Paper Trading Run

on:
  schedule:
    - cron: '35 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the trading agent (simulated money only)
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python paper_agent.py --run

      - name: Save today's results
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@users.noreply.github.com"
          git add portfolio_state.json agent_log.txt
          git diff --quiet --cached || git commit -m "Daily paper trading run"
          git push
