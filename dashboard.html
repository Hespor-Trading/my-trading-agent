<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Paper Trading Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #9198a1;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --core: #58a6ff;
    --growth: #3fb950;
    --aggressive: #f0883e;
    --shadow: 0 1px 2px 0 rgba(0,0,0,0.35), 0 1px 3px 1px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 24px 20px;
    line-height: 1.45;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  .top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green);
  }
  h1 {
    font-size: 24px;
    font-weight: 500;
    margin: 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 6px 0 16px 0;
  }
  .banner {
    background: #3b2f05;
    border: 1px solid #6b5511;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    color: #e3b341;
    margin-bottom: 18px;
  }
  .hero {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 26px 28px;
    margin-bottom: 12px;
    text-align: center;
  }
  .hero .label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }
  .hero .value {
    font-size: 44px;
    font-weight: 400;
    margin: 6px 0;
    letter-spacing: -0.5px;
  }
  .hero .change {
    font-size: 16px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .change.positive { background: rgba(63,185,80,0.15); color: var(--green); }
  .change.negative { background: rgba(248,81,73,0.15); color: var(--red); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .metric {
    background: var(--card);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 13px 14px;
  }
  .metric .label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
  }
  .metric .value {
    font-size: 19px;
    font-weight: 500;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1px;
    margin: 22px 0 10px 2px;
    color: var(--text);
  }
  .tier-card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .tier-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .tier-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    font-size: 14px;
  }
  .tier-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .tier-dot.core { background: var(--core); }
  .tier-dot.growth { background: var(--growth); }
  .tier-dot.aggressive { background: var(--aggressive); }
  .tier-value {
    font-size: 13px;
    color: var(--muted);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  .positive { color: var(--green); font-weight: 500; }
  .negative { color: var(--red); font-weight: 500; }
  .empty-note {
    color: var(--muted);
    font-size: 13px;
    padding: 4px;
  }
  .loading, .error {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .error { color: var(--red); }
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 32px;
  }
  .refresh-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--blue);
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow);
  }
  .refresh-btn:hover { background: #21262d; }

  /* --- Logo --- */
  .logo-spot {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .logo-mark {
    height: 34px;
    width: auto;
    flex-shrink: 0;
  }

  /* --- Equity chart --- */
  .chart-card {
    padding: 16px 18px 10px 18px;
  }
  .chart-wrap {
    position: relative;
    height: 220px;
    margin-top: 2px;
  }
  .chart-wrap.small {
    height: 140px;
  }

  /* --- Recent Activity --- */
  .activity-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-tag {
    flex-shrink: 0;
    min-width: 52px;
    text-align: center;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    background: #21262d;
    color: var(--muted);
  }
  .activity-tag.buy { background: rgba(88,166,255,0.15); color: var(--blue); }
  .activity-tag.sell { background: rgba(248,81,73,0.15); color: var(--red); }
  .activity-tag.skip { background: rgba(227,179,65,0.15); color: #e3b341; }
  .activity-text { flex: 1; }
  .activity-time {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="wrap">

<div class="logo-spot">
  <img class="logo-mark" src="./hespor-logo.png" alt="Hespor logo">
</div>

<div class="top"><span class="dot"></span><h1>Paper Trading Dashboard</h1></div>
<div class="subtitle">Simulated portfolio · updates automatically after each run</div>

<div class="banner">
  This tracks a fully simulated portfolio — no real money is involved. Past results here don't predict future performance.
</div>

<div id="content" class="loading">Loading…</div>

<div id="activity"></div>

<div class="footer" id="footer" style="display:none;">
  <button class="refresh-btn" onclick="load()">Refresh</button>
  <div style="margin-top:10px;">Last updated: <span id="last-updated">—</span></div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>
<script>
const STARTING_CAPITAL = 100000.00;
const RISK_TIERS = {
  core: { label: "Core", pct: 0.50 },
  growth: { label: "Growth", pct: 0.30 },
  aggressive: { label: "Aggressive", pct: 0.20 },
};

function fmt(n, decimals = 2) {
  return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtPct(n) {
  const sign = n >= 0 ? '+' : '';
  return `${sign}${(n * 100).toFixed(2)}%`;
}
function pnlClass(n) {
  return n >= 0 ? 'positive' : 'negative';
}
function tradePnl(t) {
  return (t.exit_price - t.entry_price) * t.shares - t.total_commission;
}
function tradeReturnPct(t) {
  return (t.exit_price - t.entry_price) / t.entry_price;
}

// The agent stamps everything in UTC as "YYYY-MM-DD HH:MM:SS UTC". Parse
// that into a real Date, then render it in Pacific time for display.
function parseUtcTimestamp(raw) {
  if (!raw) return null;
  const iso = raw.trim().replace(' ', 'T').replace(/ ?UTC$/, 'Z');
  const d = new Date(iso);
  return isNaN(d.getTime()) ? null : d;
}
function toPacific(date) {
  return date.toLocaleString('en-US', {
    timeZone: 'America/Los_Angeles',
    year: 'numeric', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit',
  }) + ' (PT)';
}
function formatTimestampPT(raw) {
  const d = parseUtcTimestamp(raw);
  return d ? toPacific(d) : raw;
}

async function load() {
  const content = document.getElementById('content');
  const footer = document.getElementById('footer');
  content.className = 'loading';
  content.textContent = 'Loading…';
  footer.style.display = 'none';

  loadActivity();

  try {
    const res = await fetch('./portfolio_state.json?t=' + Date.now());
    if (!res.ok) throw new Error('File not found (status ' + res.status + ')');
    const state = await res.json();
    render(state);
    document.getElementById('last-updated').textContent = toPacific(new Date());
    footer.style.display = 'block';
  } catch (err) {
    content.className = 'error';
    content.innerHTML = `
      <div>Couldn't load portfolio data.</div>
      <div style="font-size:13px; margin-top:8px; color:var(--muted);">
        Normal if the agent hasn't completed its first run yet, or if the
        repository is private. Error: ${err.message}
      </div>
    `;
    footer.style.display = 'block';
  }
}

function render(state) {
  const positions = state.positions || [];
  const trades = state.closed_trades || [];
  const cashByTier = state.cash_by_tier || {};
  const equityHistory = state.equity_history || [];

  let equity = Object.values(cashByTier).reduce((a, b) => a + b, 0);
  positions.forEach(p => { equity += p.shares * p.entry_price; });

  const totalReturn = (equity / STARTING_CAPITAL) - 1;
  const peak = state.peak_equity || STARTING_CAPITAL;
  const drawdown = peak > 0 ? (peak - equity) / peak : 0;

  let html = `
    <div class="hero">
      <div class="label">TOTAL PORTFOLIO VALUE</div>
      <div class="value">$${fmt(equity)}</div>
      <div class="change ${pnlClass(totalReturn)}">${fmtPct(totalReturn)} since start</div>
    </div>

    <div class="tier-card chart-card">
      <div class="section-title" style="margin-top:0;">Equity Over Time</div>
      ${equityHistory.length < 2
        ? `<div class="empty-note">Come back after a few runs to see the trend.</div>`
        : `<div class="chart-wrap"><canvas id="equityChart"></canvas></div>`}
    </div>

    <div class="tier-card chart-card">
      <div class="section-title" style="margin-top:0;">Drawdown From Peak</div>
      ${equityHistory.length < 2
        ? `<div class="empty-note">Come back after a few runs to see the trend.</div>`
        : `<div class="chart-wrap small"><canvas id="drawdownChart"></canvas></div>`}
    </div>

    <div class="grid">
      <div class="metric"><div class="label">Starting Capital</div><div class="value">$${fmt(STARTING_CAPITAL, 0)}</div></div>
      <div class="metric"><div class="label">Peak Value</div><div class="value">$${fmt(peak, 0)}</div></div>
      <div class="metric"><div class="label">Below Peak</div><div class="value ${drawdown > 0 ? 'negative' : ''}">${(drawdown * 100).toFixed(1)}%</div></div>
      <div class="metric"><div class="label">Open Positions</div><div class="value">${positions.length}</div></div>
      <div class="metric"><div class="label">Closed Trades</div><div class="value">${trades.length}</div></div>
      <div class="metric"><div class="label">Last Run</div><div class="value" style="font-size:13px;">${state.last_run ? esc(formatTimestampPT(state.last_run)) : 'Never'}</div></div>
    </div>

    <div class="section-title">Risk Tiers</div>
  `;

  for (const [tierKey, tierMeta] of Object.entries(RISK_TIERS)) {
    const tierPositions = positions.filter(p => p.tier === tierKey);
    const tierCash = cashByTier[tierKey] || 0;
    let tierValue = tierCash;
    tierPositions.forEach(p => { tierValue += p.shares * p.entry_price; });

    html += `
      <div class="tier-card">
        <div class="tier-header">
          <span class="tier-name"><span class="tier-dot ${tierKey}"></span>${tierMeta.label}</span>
          <span class="tier-value">$${fmt(tierValue, 0)} · ${tierPositions.length} position${tierPositions.length !== 1 ? 's' : ''}</span>
        </div>
    `;
    if (tierPositions.length === 0) {
      html += `<div class="empty-note">No open positions in this tier right now.</div>`;
    } else {
      html += `
        <table>
          <tr><th>Ticker</th><th>Shares</th><th>Entry Price</th><th>Stop Loss</th></tr>
          ${tierPositions.map(p => `
            <tr>
              <td><strong>${p.ticker}</strong></td>
              <td>${fmt(p.shares)}</td>
              <td>$${fmt(p.entry_price)}</td>
              <td>$${fmt(p.stop_price)}</td>
            </tr>
          `).join('')}
        </table>
      `;
    }
    html += `</div>`;
  }

  html += `<div class="section-title">Performance Stats</div>`;
  if (trades.length < 5) {
    html += `<div class="tier-card"><div class="empty-note">Not enough closed trades yet for meaningful stats (need at least 5).</div></div>`;
  } else {
    const winners = trades.filter(t => tradePnl(t) > 0);
    const losers = trades.filter(t => tradePnl(t) <= 0);
    const winRate = winners.length / trades.length;
    const avgWinPct = winners.length ? winners.reduce((a, t) => a + tradeReturnPct(t), 0) / winners.length : 0;
    const avgLossPct = losers.length ? losers.reduce((a, t) => a + tradeReturnPct(t), 0) / losers.length : 0;

    html += `
      <div class="grid">
        <div class="metric"><div class="label">Win Rate</div><div class="value">${(winRate * 100).toFixed(0)}%</div></div>
        <div class="metric"><div class="label">Avg Winning Trade</div><div class="value ${winners.length ? 'positive' : ''}">${winners.length ? fmtPct(avgWinPct) : '—'}</div></div>
        <div class="metric"><div class="label">Avg Losing Trade</div><div class="value ${losers.length ? 'negative' : ''}">${losers.length ? fmtPct(avgLossPct) : '—'}</div></div>
        <div class="metric"><div class="label">Closed Trades</div><div class="value">${trades.length}</div></div>
      </div>
    `;
  }

  html += `<div class="section-title">Recent Closed Trades</div>`;
  if (trades.length === 0) {
    html += `<div class="tier-card"><div class="empty-note">No trades closed yet. The agent only sells when a stop-loss triggers or the trend breaks — this can take weeks after a buy.</div></div>`;
  } else {
    const recent = [...trades].reverse().slice(0, 15);
    html += `
      <div class="tier-card">
      <table>
        <tr><th>Exit Date</th><th>Ticker</th><th>Tier</th><th>Return</th><th>P/L</th><th>Reason</th></tr>
        ${recent.map(t => {
          const pnl = tradePnl(t);
          const retPct = tradeReturnPct(t);
          return `
            <tr>
              <td>${t.exit_date}</td>
              <td><strong>${t.ticker}</strong></td>
              <td>${t.tier}</td>
              <td class="${pnlClass(retPct)}">${fmtPct(retPct)}</td>
              <td class="${pnlClass(pnl)}">$${fmt(pnl)}</td>
              <td>${t.reason}</td>
            </tr>
          `;
        }).join('')}
      </table>
      </div>
    `;
  }

  document.getElementById('content').innerHTML = html;
  document.getElementById('content').className = '';

  if (equityHistory.length >= 2) {
    renderEquityChart(equityHistory);
    renderDrawdownChart(equityHistory);
  }
}

// ---------- Equity chart ----------

let equityChartInstance = null;

function renderEquityChart(history) {
  const canvas = document.getElementById('equityChart');
  if (!canvas || typeof Chart === 'undefined') return;

  if (equityChartInstance) {
    equityChartInstance.destroy();
  }

  equityChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: history.map(h => h.date),
      datasets: [{
        data: history.map(h => h.equity),
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.12)',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: '#58a6ff',
        tension: 0.25,
        fill: true,
      }],
    },
    options: {
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => '$' + fmt(ctx.parsed.y),
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: '#9198a1', maxTicksLimit: 7, font: { size: 11 } },
        },
        y: {
          grid: { color: '#30363d' },
          ticks: {
            color: '#9198a1',
            font: { size: 11 },
            callback: v => '$' + Number(v).toLocaleString(),
          },
        },
      },
    },
  });
}

let drawdownChartInstance = null;

function renderDrawdownChart(history) {
  const canvas = document.getElementById('drawdownChart');
  if (!canvas || typeof Chart === 'undefined') return;

  let peak = -Infinity;
  const drawdowns = history.map(h => {
    peak = Math.max(peak, h.equity);
    return peak > 0 ? ((peak - h.equity) / peak) * 100 : 0;
  });

  if (drawdownChartInstance) {
    drawdownChartInstance.destroy();
  }

  drawdownChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: history.map(h => h.date),
      datasets: [{
        data: drawdowns,
        borderColor: '#f85149',
        backgroundColor: 'rgba(248,81,73,0.12)',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: '#f85149',
        tension: 0.25,
        fill: true,
      }],
    },
    options: {
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.parsed.y.toFixed(1) + '% below peak',
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: '#9198a1', maxTicksLimit: 7, font: { size: 11 } },
        },
        y: {
          reverse: true,
          grid: { color: '#30363d' },
          ticks: {
            color: '#9198a1',
            font: { size: 11 },
            callback: v => v.toFixed(0) + '%',
          },
        },
      },
    },
  });
}

// ---------- Recent Activity ----------

const ACTIVITY_LINES = 10;

const SELL_REASONS = {
  stop_loss: 'its stop-loss was hit',
  trend_break: 'its uptrend broke',
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function tierLabel(key) {
  return (RISK_TIERS[key] || {}).label || key;
}

// Turns one raw log line into { tag, time, text }. BUY / SELL / SKIP lines get
// a plain-English sentence; anything else is passed through as written.
function describeLogLine(line) {
  const stamped = line.match(/^\[([^\]]+)\]\s*(.*)$/);
  const time = stamped ? stamped[1] : '';
  const msg = (stamped ? stamped[2] : line).trim();

  let m = msg.match(/^BUY\s+(\S+)\s+\[(\w+)\]\s+([\d.]+)\s+sh\s+@\s+\$([\d,.]+)\s*=\s*\$([\d,.]+),\s*stop\s+\$([\d,.]+)/);
  if (m) {
    const [, ticker, tier, shares, price, total, stop] = m;
    return {
      tag: 'buy', time,
      text: `Bought ${shares} shares of <strong>${esc(ticker)}</strong> at $${esc(price)} ` +
            `($${esc(total)} total) for the ${esc(tierLabel(tier))} tier, with a stop-loss at $${esc(stop)}.`,
    };
  }

  m = msg.match(/^SELL\s+(\S+)\s+\[(\w+)\]\s+@\s+\$([\d,.]+)\s+\(([^)]*)\)\s+net P\/L\s+\$(-?[\d,.]+)\s+\(([^)]*)\)/);
  if (m) {
    const [, ticker, tier, price, reason, pnl, retPct] = m;
    const why = Object.prototype.hasOwnProperty.call(SELL_REASONS, reason)
      ? SELL_REASONS[reason]
      : `of ${esc(reason.replace(/_/g, ' '))}`;
    const lost = pnl.trim().startsWith('-');
    const amount = pnl.replace('-', '');
    return {
      tag: 'sell', time,
      text: `Sold <strong>${esc(ticker)}</strong> from the ${esc(tierLabel(tier))} tier at $${esc(price)} because ` +
            `${why} — a net ${lost ? 'loss' : 'gain'} of $${esc(amount)} (${esc(retPct)}).`,
    };
  }

  m = msg.match(/^SKIP\s+(\S+):\s*(.*)$/);
  if (m) {
    const [, ticker, detail] = m;
    const news = detail.match(/^negative news flag\s*--\s*(.*)$/);
    return {
      tag: 'skip', time,
      text: news
        ? `Passed on <strong>${esc(ticker)}</strong> — recent news looked negative: ${esc(news[1])}`
        : `Passed on <strong>${esc(ticker)}</strong> — ${esc(detail)}`,
    };
  }

  return { tag: 'log', time, text: esc(msg) };
}

function renderActivity(text) {
  const lines = text
    .split('\n')
    .map(l => l.trim())
    .filter(Boolean)
    // Drop the "=====" divider lines the agent writes around each run.
    .filter(l => !/^\[[^\]]+\]\s*=+\s*$/.test(l));

  let html = `<div class="section-title">Recent Activity</div><div class="tier-card">`;

  if (lines.length === 0) {
    html += `<div class="empty-note">The activity log is empty. It fills up once the agent completes a run.</div>`;
  } else {
    html += lines.slice(-ACTIVITY_LINES).reverse().map(line => {
      const e = describeLogLine(line);
      return `
        <div class="activity-item">
          <span class="activity-tag ${e.tag}">${e.tag === 'log' ? 'run' : e.tag}</span>
          <div class="activity-text">
            ${e.text}
            <div class="activity-time">${esc(formatTimestampPT(e.time))}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  html += `</div>`;
  document.getElementById('activity').innerHTML = html;
}

async function loadActivity() {
  const el = document.getElementById('activity');
  try {
    const res = await fetch('./agent_log.txt?t=' + Date.now());
    if (!res.ok) throw new Error('File not found (status ' + res.status + ')');
    renderActivity(await res.text());
  } catch (err) {
    el.innerHTML = `
      <div class="section-title">Recent Activity</div>
      <div class="tier-card">
        <div class="empty-note">
          Couldn't load the activity log. Normal if the agent hasn't run yet, or if the
          repository is private. Error: ${esc(err.message)}
        </div>
      </div>
    `;
  }
}

load();
</script>
</body>
</html>
